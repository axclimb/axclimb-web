      background:radial-gradient(120% 70% at 50% 100%, #6B2340 0%, #2B1531 38%, #120D1D 70%, var(--night) 100%) var(--night); padding:28px 16px; }

<body>
<main>
  <h1>Descarga <b>Kumbra</b></h1>
  <p id="hint">Elige tu tienda para instalar la app.</p>
  <div class="stores">
    <a class="btn" id="ios" href="https://apps.apple.com/app/id6818507035">App Store (iPhone)</a>
    <a class="btn" id="and" href="https://play.google.com/store/apps/details?id=com.axclimb.kumbra">Google Play (Android)</a>
  </div>
</main>
<script>
/* QR landing: renders the store buttons first, then redirects iOS to the App Store and Android to Google Play.
   If the browser blocks the automatic jump (in-app scanners, no user gesture), the buttons stay as fallback.
   Analytics: ?src=<name> tags where people came from (each printed QR gets its own, e.g. ?src=qr-rocodromo).
   Each visit and each jump to a store is sent to /api/kumbraQr (Supabase qr_events, anonymous).
   Installs are counted by the stores themselves: Google Play gets utm_source=<src> in the referrer (Play
   Console > Acquisition), and the App Store gets ct=<src> once IOS_PT (App Store Connect provider token,
   App Analytics > Campaigns > "Generate a campaign link") is filled in. */
(function () {
  var IOS_PT = ""; // App Store Connect provider token; without it the App Store link has no campaign.
  // Only visits with ?src (the printed QRs) are counted; plain /kumbra/join is not tracked at all.
  var src = (new URLSearchParams(location.search).get("src") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40);
  var IOS = "https://apps.apple.com/app/id6818507035" + (src && IOS_PT ? "?pt=" + IOS_PT + "&ct=" + src + "&mt=8" : "");
  var AND = "https://play.google.com/store/apps/details?id=com.axclimb.kumbra" + (src ? "&referrer=" +
    encodeURIComponent("utm_source=" + src + "&utm_medium=qr&utm_campaign=kumbra_join") : "");
  document.getElementById("ios").href = IOS;
  document.getElementById("and").href = AND;

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAnd = /Android/i.test(ua);
  var platform = isIOS ? "ios" : (isAnd ? "android" : "other");

  // One visit and one store jump per phone every 30 min: the iPhone camera can preload the page when it
  // spots the QR and load it again on tap, and Safari reloads it when coming back from the App Store.
  function once(kind) {
    try {
      var k = "kumbraQr:" + src + ":" + kind, now = Date.now(), last = Number(localStorage.getItem(k)) || 0;
      if (now - last < 30 * 60 * 1000) return false;
      localStorage.setItem(k, String(now));
    } catch (e) {}
    return true;
  }
  function track(kind, where) {
    if (!src || !once(kind)) return;
    var data = JSON.stringify({ src: src, kind: kind, platform: where || platform });
    try {
      if (navigator.sendBeacon && navigator.sendBeacon("/api/kumbraQr", new Blob([data], { type: "text/plain" }))) return;
    } catch (e) {}
    try { fetch("/api/kumbraQr", { method: "POST", headers: { "Content-Type": "application/json" }, body: data, keepalive: true }); } catch (e) {}
  }
  var jumped = false;
  function toStore(where) { if (!jumped) { jumped = true; track("store", where); } }

  // The first open marks the URL (?seen=1, without a new history entry). When Safari restores or reloads the
  // tab later (reopening the app, coming back from the store), the page sees the mark and neither counts a
  // visit nor jumps to the store again: it just shows the buttons.
  var params = new URLSearchParams(location.search);
  var nav = (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {};
  var reopened = params.get("seen") === "1" || nav.type === "reload" || nav.type === "back_forward";
  if (!reopened) {
    try { params.set("seen", "1"); history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash); } catch (e) {}
  }

  // A preloaded page (document.prerendering) only counts if the person actually opens it.
  if (!reopened) {
    if (document.prerendering) document.addEventListener("prerenderingchange", function () { track("visit"); }, { once: true });
    else track("visit");
  }
  document.getElementById("ios").addEventListener("click", function () { toStore("ios"); });
  document.getElementById("and").addEventListener("click", function () { toStore("android"); });

  var target = isIOS ? IOS : (isAnd ? AND : null);
  if (!target || reopened) return;
  document.getElementById("hint").textContent = "Abriendo la tienda… Si no se abre, pulsa tu botón.";
  setTimeout(function () { toStore(); window.location.href = target; }, 300);
})();
</script>
</body>
</html>
