  <script>
  /* QR landing: sends iPhone/iPad to the App Store and Android to Google Play; desktop sees both buttons. */
  (function () {
    var IOS = "https://apps.apple.com/app/id6818507035";
    var AND = "https://play.google.com/store/apps/details?id=com.axclimb.kumbra";
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAnd = /Android/i.test(ua);
    if (isIOS) location.replace(IOS);
    else if (isAnd) location.replace(AND);
  })();
  </script>
